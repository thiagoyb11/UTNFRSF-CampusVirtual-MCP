[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "utnfrsf-campusvirtual-mcp"
version = "0.1.0"
description = "Servidor MCP para el Campus Virtual de la UTN FRSF, basado en Lightpanda."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "lightpanda>=1.0.2,<2",
    "mcp>=2.3,<3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.5,<3",
]

[project.scripts]
utnfrsf-campus-mcp = "utnfrsf_campus_mcp.server:main"

[project.urls]
Repository = "https://github.com/thiagoyb11/UTNFRSF-CampusVirtual-MCP"

[dependency-groups]
dev = [
    "anyio>=4.9,<5",
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/utnfrsf_campus_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requiere ejecutar Lightpanda; se habilita con RUN_LIGHTPANDA_TESTS=1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
